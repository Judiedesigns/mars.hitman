<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anniversary Spacing Explorations</title>
    <style>
      @font-face {
        font-family: "Anonymous Pro";
        font-style: normal;
        font-weight: 400;
        src: url("https://static.figma.com/font/AnonymousPro-Regular_1") format("woff2");
      }

      :root {
        --pink: #ff70ff;
        --rule: rgba(255, 112, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        background: #fff;
        color: var(--pink);
        font-family: "Anonymous Pro", "Courier New", monospace;
      }

      button {
        border: 0;
        padding: 0;
        color: inherit;
        background: transparent;
        font: inherit;
      }

      .exploration {
        --title-copy: 24px;
        --copy-orbit: 40px;
        --image-signature: 92px;
        width: 100%;
        min-height: 100vh;
        padding: 24px 24px 64px;
        border-bottom: 1px solid var(--rule);
        background: #fff;
      }

      .exploration:last-child {
        border-bottom: 0;
      }

      .exploration--balanced {
        --title-copy: 40px;
        --copy-orbit: 72px;
        --image-signature: 128px;
      }

      .exploration--airy {
        --title-copy: 64px;
        --copy-orbit: 112px;
        --image-signature: 176px;
      }

      .exploration-label {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        width: min(1120px, 100%);
        margin: 0 auto;
        color: var(--pink);
        font-size: 11px;
        line-height: 16px;
        opacity: 0.68;
      }

      .spacing-values {
        text-align: right;
      }

      .layout {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 48px;
        text-align: center;
      }

      h1 {
        display: inline-flex;
        align-items: baseline;
        justify-content: center;
        max-width: calc(100vw - 32px);
        margin: 0;
        color: var(--pink);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .heart {
        display: inline-flex;
        flex: 0 0 auto;
        margin-left: 8px;
        transform: translateY(1px);
      }

      .opening {
        width: min(431px, 90vw);
        margin: var(--title-copy) 0 0;
        font-size: 16px;
        line-height: 22.4px;
      }

      .stage-shell {
        position: relative;
        width: min(600px, calc(100vw - 32px));
        margin-top: var(--copy-orbit);
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 600 / 520;
      }

      .photo {
        position: absolute;
        left: 17.625%;
        top: 22.5%;
        width: 62.333%;
        height: 62.692%;
        overflow: hidden;
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .month {
        position: absolute;
        min-width: 20px;
        min-height: 20px;
        transform: translate(-50%, -50%);
        color: var(--pink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
        line-height: 20px;
        text-align: center;
      }

      .play {
        position: absolute;
        left: calc(100% + 54px);
        top: 51%;
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        transform: translateY(-50%);
        cursor: pointer;
        transition: opacity 160ms ease, transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .play:hover {
        opacity: 0.62;
      }

      .play:active {
        transform: translateY(-50%) scale(0.96);
      }

      .signature {
        width: 62.333%;
        margin: calc(var(--image-signature) - 77px) 0 0 17.625%;
        color: var(--pink);
        font-size: 16px;
        line-height: 22.4px;
        text-align: center;
      }

      @media (max-width: 760px) {
        .exploration {
          min-height: auto;
          padding: 18px 16px 48px;
        }

        .exploration-label {
          align-items: flex-start;
          font-size: 10px;
        }

        .spacing-values {
          max-width: 190px;
        }

        .layout {
          padding-top: 38px;
        }

        h1 {
          flex-wrap: wrap;
          padding: 0 8px;
        }

        .stage-shell {
          width: min(600px, calc(100vw - 24px));
        }

        .play {
          right: 5%;
          left: auto;
          top: 54%;
        }
      }

      @media (max-width: 480px) {
        .exploration--balanced {
          --title-copy: 36px;
          --copy-orbit: 60px;
          --image-signature: 116px;
        }

        .exploration--airy {
          --title-copy: 52px;
          --copy-orbit: 84px;
          --image-signature: 148px;
        }

        .layout {
          padding-top: 32px;
        }

        .opening {
          font-size: 15px;
          line-height: 21px;
        }

        .month {
          font-size: 11px;
        }

        .signature {
          width: 68%;
          margin-left: 14.5%;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main id="explorations"></main>

    <script>
      const imagePath = "./src/imports/Body-1/583807724b86d07a16503e7117efd79409667b02.png";
      const opening = "Everything fell in place when we met, it felt like coming home after a long time. Sometimes the stars align, and we can only enjoy the results. I hope I am able to show you every day how much I love you.";
      const positions = [
        [1, 299.75, 107], [2, 342.75, 63], [3, 402.75, 31], [4, 476.75, 24],
        [5, 544.75, 82], [6, 563.75, 153], [7, 549.75, 229], [8, 517.75, 287],
        [9, 480.75, 345], [10, 429.75, 400], [11, 365.75, 454], [12, 299.75, 491],
        [13, 232.75, 450], [14, 172.75, 399], [15, 122.75, 348], [16, 69.75, 282],
        [17, 39.75, 230], [18, 33.75, 157], [19, 46.75, 82], [20, 95.75, 24],
        [21, 173.75, 23], [22, 229.75, 31], [23, 262.75, 63], [24, 299.75, 158],
      ];
      const variants = [
        { className: "", name: "01 Close / Intentional", values: "H–P 24px · P–O 40px · I–S 92px" },
        { className: "exploration--balanced", name: "02 Balanced", values: "H–P 40px · P–O 72px · I–S 128px" },
        { className: "exploration--airy", name: "03 Airy / Editorial", values: "H–P 64px · P–O 112px · I–S 176px" },
      ];

      const heart = `
        <span class="heart" aria-hidden="true">
          <svg width="20" height="18" viewBox="0 0 18 16" fill="none">
            <path d="M9 15.25C8.78 15.25 8.56 15.17 8.39 15.02C2.7 10.1 0 7.23 0 3.96C0 1.75 1.75 0 3.96 0C5.2 0 6.39.58 7.16 1.5L9 3.7L10.84 1.5C11.61.58 12.8 0 14.04 0C16.25 0 18 1.75 18 3.96C18 7.23 15.3 10.1 9.61 15.02C9.44 15.17 9.22 15.25 9 15.25Z" fill="#ff70ff" />
          </svg>
        </span>`;

      const numberMarkup = positions
        .map(([number, x, y]) => `<span class="month" style="left:${(x / 600) * 100}%;top:${(y / 520) * 100}%">${number}</span>`)
        .join("");

      document.querySelector("#explorations").innerHTML = variants
        .map(
          ({ className, name, values }) => `
            <section class="exploration ${className}">
              <div class="exploration-label">
                <span>${name}</span>
                <span class="spacing-values">${values}</span>
              </div>
              <div class="layout">
                <h1>Happy 24-month anniversary baby${heart}</h1>
                <p class="opening">${opening}</p>
                <div class="stage-shell">
                  <div class="stage">
                    <div class="photo"><img src="${imagePath}" alt="A couple smiling together" /></div>
                    ${numberMarkup}
                    <button class="play" type="button" aria-label="Play music" title="Play music">
                      <svg width="13" height="16" viewBox="0 0 13 16" fill="none" aria-hidden="true">
                        <path d="M13 8L0 16V0L13 8Z" fill="#ff70ff" />
                      </svg>
                    </button>
                  </div>
                  <p class="signature">Mars &amp; the Hitman</p>
                </div>
              </div>
            </section>`
        )
        .join("");
    </script>
  </body>
</html>
