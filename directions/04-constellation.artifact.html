<title>Lying Down, Looking Up</title>

<style>
/* ------------------------------------------------------------------
   twenty-four · plate 04 · LYING DOWN, LOOKING UP

   A dark star chart. Two people on their backs at the bottom edge.
   Twenty-four stars overhead, unlit until said. Two rings, because
   it took two years.
------------------------------------------------------------------ */

:root {
  --night:   #101725;   /* deep ink blue — a night, not a black */
  --night-2: #0a0f1a;   /* the edges of the plate */
  --chalk:   #ebe6d8;   /* warm engraver's white */
  --ember:   #e8703f;   /* one warm mark, used once at a time */

  --c-90: rgba(235,230,216,0.90);
  --c-70: rgba(235,230,216,0.70);
  --c-55: rgba(235,230,216,0.55);
  --c-44: rgba(235,230,216,0.44);
  --c-30: rgba(235,230,216,0.30);
  --c-20: rgba(235,230,216,0.20);
  --c-13: rgba(235,230,216,0.13);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino,
           "Times New Roman", Times, serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* the plate has a printed edge: a little darker at the corners */
#vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background:
    radial-gradient(120% 95% at 50% 40%,
      rgba(24,34,54,0.55) 0%,
      rgba(16,23,37,0.00) 45%,
      rgba(7,11,18,0.55) 100%);
}

#sky { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

/* ---------- chart furniture ---------- */

.ring        { fill: none; stroke: var(--c-13); stroke-width: 1; }
.ring.faint  { stroke: rgba(235,230,216,0.08); }
.tick        { stroke: var(--c-20); stroke-width: 1; }
.tick.major  { stroke: var(--c-30); }
.mark        { fill: var(--c-30); stroke: none; }
.mark.open   { fill: none; stroke: var(--c-30); stroke-width: 1; }

.deg {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.10em;
  fill: rgba(235,230,216,0.26);
}

.ringlabel {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.34em;
  fill: var(--c-30);
}

.num {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  fill: rgba(235,230,216,0.28);
  transition: fill 500ms ease;
}
.num.is-lit  { fill: var(--c-70); }
.num.is-here { fill: var(--ember); }

.dust { fill: rgba(235,230,216,0.16); }

.body {           /* moon, planet, meteor — same hand as everything else */
  fill: none;
  stroke: rgba(235,230,216,0.34);
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.body.fill { fill: var(--c-20); stroke: none; }
.body.dash { stroke-dasharray: 1.5 5.5; stroke: var(--c-20); }

/* ---------- the stars ---------- */

.sdot {
  fill: var(--c-20);
  transition: fill 600ms ease, r 600ms ease;
}
.sdot.is-lit  { fill: var(--chalk); }
.sdot.is-here { fill: var(--ember); }

.sglyph {
  fill: var(--chalk);
  opacity: 0;
  transition: opacity 700ms ease;
}
.sglyph.is-on   { opacity: 0.95; }
.sglyph.is-here { fill: var(--ember); opacity: 1; }

.shit { fill: transparent; cursor: pointer; }

/* the one thing that moves: the star being spoken about */
#cur {
  fill: none;
  stroke: var(--ember);
  stroke-width: 1;
  opacity: 0;
  transition: opacity 600ms ease;
}
#cur.is-on { opacity: 0.5; animation: glim 4.6s ease-in-out infinite; }
@keyframes glim {
  0%, 100% { opacity: 0.26; }
  50%      { opacity: 0.62; }
}

#chain {
  fill: none;
  stroke: rgba(235,230,216,0.42);
  stroke-width: 1.15;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke-dashoffset 1100ms cubic-bezier(.35,.02,.2,1);
}
#chain.is-done { stroke: rgba(235,230,216,0.58); }

/* the thin line from the lit star down to what was said */
#leader {
  fill: none;
  stroke: var(--ember);
  stroke-width: 0.8;
  opacity: 0;
  stroke-linecap: round;
  transition: opacity 600ms ease, stroke-dashoffset 900ms cubic-bezier(.3,.02,.2,1);
}
#leader.is-on { opacity: 0.42; }

/* ---------- the ground and the two of them ---------- */

#ground {
  fill: none;
  stroke: rgba(235,230,216,0.17);
  stroke-width: 1;
  stroke-linecap: round;
}

.figure {
  fill: none;
  stroke: rgba(235,230,216,0.62);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 900ms ease;
}
.figure.hair { stroke-width: 1.3; }
body.is-done .figure { stroke: rgba(235,230,216,0.80); }

/* ---------- type on the plate ---------- */

.plate { position: fixed; z-index: 2; user-select: none; }

#head { top: 30px; left: 34px; }
#head .t {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.42em;
  color: var(--c-90);
  text-transform: uppercase;
}
#head .s {
  margin-top: 9px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  line-height: 1.85;
  color: var(--c-44);
  text-transform: lowercase;
}

#count { top: 30px; right: 34px; text-align: right; }
#count .n {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.16em;
  color: var(--c-90);
}
#count .n em { font-style: normal; color: var(--c-30); }
#count .y {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--c-55);
}
#count .y b { font-weight: 400; color: var(--ember); }

/* the caption, in the manner of a line of poetry at the foot of a page */
#cap {
  right: 34px;
  bottom: 52px;
  width: 340px;
  z-index: 2;
}
#prompt {
  margin: 0 0 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.72;
  letter-spacing: 0.08em;
  color: rgba(235,230,216,0.62);
  text-transform: lowercase;
}
#cap.is-start #prompt { color: var(--c-44); }
.voice { margin: 0 0 15px; transition: opacity 600ms ease; }
.voice:last-of-type { margin-bottom: 0; }
.voice.is-waiting { opacity: 0.22; }
#cap.is-start .voice { display: none; }
.vname {
  display: block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(235,230,216,0.52);
  margin-bottom: 6px;
}
.vline {
  margin: 0;
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.66;
  color: var(--c-90);
  white-space: pre-wrap;
}
.vline.is-empty { color: rgba(235,230,216,0.38); font-style: italic; }
#capfoot {
  margin-top: 20px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ember);
  opacity: 0;
  transition: opacity 900ms ease;
}
#capfoot.is-on { opacity: 0.75; }

#hint {
  left: 34px;
  bottom: 52px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(235,230,216,0.52);
  transition: opacity 700ms ease;
}
#hint.is-off { opacity: 0; }

@media (max-width: 820px) {
  #head { top: 20px; left: 20px; }
  #head .t { font-size: 11px; letter-spacing: 0.3em; }
  #head .s { display: none; }
  #count { top: 20px; right: 20px; }
  #cap { left: 20px; right: 20px; width: auto; bottom: 128px; }
  .vline { font-size: 14px; }
  .voice { margin-bottom: 12px; }
  #prompt { margin-bottom: 14px; }
  #hint { left: 20px; bottom: 20px; font-size: 9px; letter-spacing: 0.14em; }
}

@media (prefers-reduced-motion: reduce) {
  #chain, #leader, .sdot, .sglyph, .num, #cur, .voice, #hint, #capfoot, .figure {
    transition-duration: 1ms !important;
  }
  #cur.is-on { animation: none; opacity: 0.5; }
}
</style>

<svg id="sky" role="img" aria-label="A dark star chart: twenty-four stars over two people lying on their backs"></svg>

</div>

</div>

<script>
(function () {
  "use strict";

  /* ================= the data ================= */

  var PEOPLE = { a: "me", b: "dams" };
  var ENTRIES = [
    { n:  1, prompt: "", a: "I like how you take on tasks and execute them with such precision,", b: "" },
    { n:  2, prompt: "", a: "I love how he is passionate about the things he cares about", b: "" },
    { n:  3, prompt: "", a: "How he is consistent with what he wants", b: "" },
    { n:  4, prompt: "", a: "he Does what he says he will do", b: "" },
    { n:  5, prompt: "", a: "“How can I help ?” “What can we do?” My favorite words", b: "" },
    { n:  6, prompt: "", a: "I love how he cares about his body", b: "" },
    { n:  7, prompt: "", a: "Listens to what I say", b: "" },
    { n:  8, prompt: "", a: "Is very helpful", b: "" },
    { n:  9, prompt: "", a: "You are so incredibly talented and helpful", b: "" },
    { n: 10, prompt: "", a: "You are good and it is not just to me alone, your friends, mom and the people around you", b: "" },
    { n: 11, prompt: "", a: "You are very empathetic my twin for real", b: "" },
    { n: 12, prompt: "", a: "my favorite human God blessed me with I love you", b: "" },
    { n: 13, prompt: "", a: "I love him, he’s amazing and sweet", b: "" },

    { n: 15, prompt: "", a: "He is just happy to be here - with me", b: "" },
    { n: 16, prompt: "", a: "I like his music taste", b: "" },
    { n: 17, prompt: "", a: "he’s crazy about me", b: "" },
    { n: 18, prompt: "", a: "He wants what’s best for me", b: "" },
    { n: 19, prompt: "", a: "He only sees me", b: "" },
    { n: 20, prompt: "", a: "He thinks of me a lot, gave me my first and second jersey", b: "" },
    { n: 21, prompt: "", a: "He’s very thoughtful", b: "" },
    { n: 22, prompt: "", a: "He’s empathetic and feels his emotions", b: "" },
    { n: 23, prompt: "", a: "Pays attention to me", b: "" },
    { n: 24, prompt: "", a: "Dams sends me money", b: "" }
  ];
  var TITLE = "Mars & the Hitman";
  var SUBTITLE = "why dams";
  var OPENING = "Everything fell in place when we met, it felt like coming home after a long time. Sometimes the stars align, and we can only enjoy the results. Mars & the Hitman";
  var HOPE = "I hope I am able to show you every day how much I love you.";
  var QUESTION = "am I loving you better, and what can I do better?";
  var PROMISE = "to try my best with you always";
  var CODA = "You love me like my sisters, unconditionally";

  var N = ENTRIES.length;
  var OPENING = "twenty-four things, one for each month. none of them said yet — " +
                "the sky above you is still empty.";

  /* ================= small tools ================= */

  var NS = "http://www.w3.org/2000/svg";

  function mk(name, attrs) {
    var e = document.createElementNS(NS, name), k;
    if (attrs) for (k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function seeded(s) {
    return function () {
      s = (s * 1664525 + 1013904223) % 4294967296;
      return s / 4294967296;
    };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function deg(r) { return r * 180 / Math.PI; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* a segment drawn by a hand: wanders in the middle, lands on both ends */
  function hand(p0, p1, amp, rnd, sub) {
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var a1 = (rnd() - 0.5) * 2.0, a2 = (rnd() - 0.5) * 1.0, ph = rnd() * 6.283;
    var A = Math.min(amp, len * 0.05);
    var out = [], s, u, env, off;
    sub = sub || 14;
    for (s = 1; s <= sub; s++) {
      u = s / sub;
      env = Math.sin(Math.PI * u);
      off = (a1 * Math.sin(u * 2.4 + ph) + a2 * Math.sin(u * 6.1 + ph * 2)) * env * A;
      out.push({ x: p0.x + dx * u + nx * off, y: p0.y + dy * u + ny * off });
    }
    return out;
  }
  function poly(pts, close) {
    var d = "M " + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2), i;
    for (i = 1; i < pts.length; i++) d += " L " + pts[i].x.toFixed(2) + " " + pts[i].y.toFixed(2);
    return d + (close ? " Z" : "");
  }
  /* a run of points, wobbled, for the doodled figures */
  function handPoly(pts, amp, rnd) {
    var out = [pts[0]], i;
    for (i = 1; i < pts.length; i++) {
      out = out.concat(hand(pts[i - 1], pts[i], amp, rnd, 6));
    }
    return poly(out, false);
  }
  function starD(r) {
    var t = (r * 0.20).toFixed(2), R = r.toFixed(2), m = (-r).toFixed(2), mt = (-r * 0.20).toFixed(2);
    return "M 0 " + m + " Q " + t + " " + mt + " " + R + " 0" +
           " Q " + t + " " + t + " 0 " + R +
           " Q " + mt + " " + t + " " + m + " 0" +
           " Q " + mt + " " + mt + " 0 " + m + " Z";
  }

  /* ================= the sky, in normalised polar ================= */
  /* Fixed once, so the constellation is the same shape at every size.
     Twelve stops a year, but nothing regular about the steps: the ring
     is the chart, the scatter is the sky. */

  var SKY = (function () {
    var rnd = seeded(240724), out = [], y, i, steps, sum, walked, ang;
    for (y = 0; y < 2; y++) {
      steps = []; sum = 0;
      for (i = 0; i < 12; i++) { var st = 1 + (rnd() - 0.5) * 1.05; steps.push(st); sum += st; }
      walked = 0;
      for (i = 0; i < 12; i++) {
        ang = -Math.PI / 2 + (walked / sum) * 2 * Math.PI;
        out.push({
          i: y * 12 + i,
          year: y,
          ang: ang,
          rf: (y === 0 ? 0.585 : 1) * (1 + (rnd() - 0.5) * (y === 0 ? 0.44 : 0.26)),
          size: 0.84 + rnd() * 0.38
        });
        walked += steps[i];
      }
    }
    return out;
  })();

  var DUST = (function () {
    var rnd = seeded(80311), out = [], i;
    for (i = 0; i < 84; i++) {
      out.push({ x: rnd(), y: rnd() * 0.86, r: 0.5 + rnd() * 0.8, o: 0.08 + rnd() * 0.16 });
    }
    return out;
  })();

  /* ================= the two of them ================= */
  /* Local units, ground at y = 0, head at the left, knees in the air.
     Drawn the way you'd draw it on the back of something. */

  function figureA() {
    return {
      head: { x: 0, y: -10, r: 9.5 },
      hair: [
        [{x:-9,y:-14},{x:-13,y:-19},{x:-7,y:-19},{x:-11,y:-24},{x:-4,y:-22},{x:-6,y:-27}],
        [{x:-4,y:-19},{x:0,y:-25},{x:3,y:-20},{x:5,y:-24}]
      ],
      lines: [
        [{x:9.5,y:-10},{x:26,y:-8.5},{x:44,y:-8},{x:56,y:-8}],          /* back */
        [{x:56,y:-8},{x:68,y:-31},{x:61,y:-52},{x:70,y:-56}],           /* near leg */
        [{x:55,y:-7},{x:77,y:-26},{x:75,y:-45},{x:84,y:-48}],           /* far leg */
        [{x:18,y:-9},{x:31,y:-23},{x:25,y:-35}],                        /* arm, up */
        [{x:16,y:-6},{x:34,y:-3},{x:45,y:-5}]                           /* arm, down */
      ]
    };
  }
  function figureB() {
    return {
      head: { x: 0, y: -9.5, r: 9 },
      hair: [
        [{x:-8,y:-13},{x:-13,y:-17},{x:-6,y:-18},{x:-10,y:-23},{x:-3,y:-21}],
        [{x:-3,y:-18},{x:1,y:-24},{x:4,y:-19}]
      ],
      lines: [
        [{x:9,y:-9.5},{x:26,y:-8},{x:42,y:-7.5},{x:54,y:-8}],
        [{x:54,y:-8},{x:70,y:-29},{x:81,y:-47},{x:90,y:-45}],
        [{x:53,y:-7},{x:61,y:-31},{x:69,y:-44},{x:78,y:-42}],
        [{x:17,y:-9},{x:27,y:-22},{x:38,y:-28}],
        [{x:15,y:-6},{x:2,y:-3},{x:-6,y:-7}]                          /* hand, reaching back */
      ]
    };
  }

  /* ================= build ================= */

  var svg     = document.getElementById("sky");
  var elCap   = document.getElementById("cap");
  var elPr    = document.getElementById("prompt");
  var elLA    = document.getElementById("la");
  var elLB    = document.getElementById("lb");
  var elVA    = document.getElementById("va");
  var elVB    = document.getElementById("vb");
  var elCN    = document.getElementById("countn");
  var elCY    = document.getElementById("county");
  var elHint  = document.getElementById("hint");
  var elFoot  = document.getElementById("capfoot");

  document.getElementById("na").textContent = PEOPLE.a;
  document.getElementById("nb").textContent = PEOPLE.b;
  document.getElementById("headsub").innerHTML =
    "a chart of the sky over " + PEOPLE.a + " and " + PEOPLE.b + "<br>" +
    "two years · twenty-four stars · plotted one at a time";

  var G = {};              /* live geometry + element refs */
  var current = -1;        /* which of the 24 we are lying under */
  var beat = 0;            /* 0 = one voice has spoken, 1 = both */

  function build() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var W = svg.clientWidth  || window.innerWidth;
    var H = svg.clientHeight || window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var narrow = W < 820;
    var R  = clamp(Math.min(W * 0.40, H * 0.335), 92, 400);
    var CX = W / 2;
    var CY = H * (narrow ? 0.40 : 0.42);
    var SC = clamp(R / 301, 0.60, 1.18);

    G.W = W; G.H = H; G.R = R; G.CX = CX; G.CY = CY; G.SC = SC; G.narrow = narrow;

    var gDust  = mk("g"), gChart = mk("g"), gBody = mk("g"),
        gChain = mk("g"), gStars = mk("g"), gLow  = mk("g");

    /* ---- dust: enough to be a sky, not enough to be a screensaver ---- */
    DUST.forEach(function (d) {
      var c = mk("circle", { class: "dust", cx: (d.x * W).toFixed(1),
                             cy: (d.y * H).toFixed(1), r: (d.r * SC).toFixed(2) });
      c.setAttribute("opacity", d.o.toFixed(2));
      gDust.appendChild(c);
    });

    /* ---- the chart: two rings, a limb scale, ticks, cardinal marks ---- */
    var Ri = R * 0.585, Rs = R + 38 * SC;

    gChart.appendChild(mk("circle", { class: "ring", cx: CX, cy: CY, r: Ri.toFixed(1) }));
    gChart.appendChild(mk("circle", { class: "ring", cx: CX, cy: CY, r: R.toFixed(1) }));
    gChart.appendChild(mk("circle", { class: "ring faint", cx: CX, cy: CY, r: Rs.toFixed(1) }));

    /* the limb: a tick every five degrees, a longer one every thirty */
    var a, i2, rad, t0, t1, x0, y0, x1, y1;
    for (a = 0; a < 360; a += 5) {
      rad = (a - 90) * Math.PI / 180;
      var major = (a % 30 === 0);
      t0 = Rs; t1 = Rs + (major ? 8 : 3.5) * SC;
      x0 = CX + Math.cos(rad) * t0; y0 = CY + Math.sin(rad) * t0;
      x1 = CX + Math.cos(rad) * t1; y1 = CY + Math.sin(rad) * t1;
      gChart.appendChild(mk("line", { class: "tick" + (major ? " major" : ""),
        x1: x0.toFixed(1), y1: y0.toFixed(1), x2: x1.toFixed(1), y2: y1.toFixed(1) }));
      if (major && !narrow) {
        var lx = CX + Math.cos(rad) * (Rs + 19 * SC), ly = CY + Math.sin(rad) * (Rs + 19 * SC);
        var tx = mk("text", { class: "deg", "text-anchor": "middle",
          transform: "translate(" + lx.toFixed(1) + "," + ly.toFixed(1) + ") rotate(" + deg(rad).toFixed(1) + ")" });
        tx.setAttribute("dy", "0.34em");
        tx.setAttribute("font-size", (8.5 * SC).toFixed(1));
        tx.textContent = (a < 100 ? (a < 10 ? "00" : "0") : "") + a + "°";
        gChart.appendChild(tx);
      }
    }

    /* cardinal triangles on the limb */
    [0, 90, 180, 270].forEach(function (a2) {
      var r2 = (a2 - 90) * Math.PI / 180;
      var px = CX + Math.cos(r2) * (Rs + 3 * SC), py = CY + Math.sin(r2) * (Rs + 3 * SC);
      var s = 4.6 * SC;
      var tri = mk("path", { class: "mark",
        d: "M 0 " + (-s) + " L " + (s * 0.82) + " " + (s * 0.7) + " L " + (-s * 0.82) + " " + (s * 0.7) + " Z",
        transform: "translate(" + px.toFixed(1) + "," + py.toFixed(1) + ") rotate(" + (deg(r2) + 90).toFixed(1) + ")" });
      gChart.appendChild(tri);
    });

    /* two diamonds, one on each ring at the top: where each year begins */
    [Ri, R].forEach(function (rr) {
      var s = 3.6 * SC;
      gChart.appendChild(mk("path", { class: "mark open",
        d: "M 0 " + (-s) + " L " + s + " 0 L 0 " + s + " L " + (-s) + " 0 Z",
        transform: "translate(" + CX.toFixed(1) + "," + (CY - rr).toFixed(1) + ")" }));
    });

    /* the centre mark */
    var cs = 5 * SC;
    gChart.appendChild(mk("line", { class: "tick", x1: CX - cs, y1: CY, x2: CX + cs, y2: CY }));
    gChart.appendChild(mk("line", { class: "tick", x1: CX, y1: CY - cs, x2: CX, y2: CY + cs }));
    gChart.appendChild(mk("circle", { class: "ring", cx: CX, cy: CY, r: (10 * SC).toFixed(1) }));

    /* which ring is which year, set along the ring the way a chart does */
    [["year one · months 01–12", Ri, 312], ["year two · months 13–24", R, 48]]
      .forEach(function (p) {
        if (narrow) return;
        var r3 = (p[2] - 90) * Math.PI / 180;
        var px = CX + Math.cos(r3) * (p[1] - 14 * SC), py = CY + Math.sin(r3) * (p[1] - 14 * SC);
        var t = mk("text", { class: "ringlabel", "text-anchor": "middle",
          transform: "translate(" + px.toFixed(1) + "," + py.toFixed(1) + ") rotate(" + (deg(r3) + 90).toFixed(1) + ")" });
        t.setAttribute("font-size", (9.5 * SC).toFixed(1));
        t.textContent = p[0];
        gChart.appendChild(t);
      });

    /* ---- moon, planet, one meteor: sparingly, same hand ---- */
    var bs = SC * (narrow ? 0.8 : 1);
    var mx = W * 0.115, my = H * 0.15, mr = 21 * bs;
    if (narrow) { mx = W * 0.16; my = H * 0.11; }
    gBody.appendChild(mk("path", { class: "body",
      d: "M " + (mx) + " " + (my - mr) +
         " A " + mr + " " + mr + " 0 1 0 " + mx + " " + (my + mr) +
         " A " + (mr * 0.80) + " " + (mr * 0.80) + " 0 1 1 " + mx + " " + (my - mr) + " Z" }));

    var px2 = W * 0.885, py2 = H * 0.17, pr = 13 * bs;
    if (narrow) { px2 = W * 0.82; py2 = H * 0.10; }
    gBody.appendChild(mk("circle", { class: "body", cx: px2, cy: py2, r: pr }));
    gBody.appendChild(mk("ellipse", { class: "body", cx: px2, cy: py2,
      rx: (pr * 1.95).toFixed(1), ry: (pr * 0.46).toFixed(1),
      transform: "rotate(-19 " + px2.toFixed(1) + " " + py2.toFixed(1) + ")" }));

    var m0 = { x: W * 0.10, y: H * 0.66 }, m1 = { x: W * 0.215, y: H * 0.545 };
    if (narrow) { m0 = { x: W * 0.10, y: H * 0.62 }; m1 = { x: W * 0.30, y: H * 0.545 }; }
    gBody.appendChild(mk("path", { class: "body dash", d: poly(hand(m0, m1, 3, seeded(9), 12), false) }));
    var mg = mk("path", { class: "mark", d: starD(4.2 * bs),
      transform: "translate(" + m1.x.toFixed(1) + "," + m1.y.toFixed(1) + ")" });
    gBody.appendChild(mg);

    /* ---- stars ---- */
    var pos = SKY.map(function (s) {
      return {
        i: s.i,
        x: CX + Math.cos(s.ang) * (R * s.rf),
        y: CY + Math.sin(s.ang) * (R * s.rf) * 0.955,
        ang: s.ang,
        size: s.size
      };
    });
    G.pos = pos;

    /* the chain, joined in order, drawn by a hand */
    var rnd = seeded(1109);
    var pts = [pos[0]], nodeAt = [0], k;
    for (k = 1; k < N; k++) {
      pts = pts.concat(hand(pos[k - 1], pos[k], 7 * SC, rnd, 16));
      nodeAt.push(pts.length - 1);
    }
    var cum = [0], j, ddx, ddy;
    for (j = 1; j < pts.length; j++) {
      ddx = pts[j].x - pts[j - 1].x; ddy = pts[j].y - pts[j - 1].y;
      cum.push(cum[j - 1] + Math.sqrt(ddx * ddx + ddy * ddy));
    }
    G.total = cum[cum.length - 1];
    G.nodeLen = nodeAt.map(function (ix) { return cum[ix]; });

    var chain = mk("path", { id: "chain", d: poly(pts, false) });
    chain.setAttribute("stroke-dasharray", G.total.toFixed(1));
    chain.setAttribute("stroke-dashoffset", G.total.toFixed(1));
    gChain.appendChild(chain);
    G.chain = chain;

    var leader = mk("path", { id: "leader", d: "M 0 0" });
    gChain.appendChild(leader);
    G.leader = leader;

    var cur = mk("circle", { id: "cur", cx: -99, cy: -99, r: (10 * SC).toFixed(1) });
    gStars.appendChild(cur);
    G.cur = cur;

    G.dots = []; G.glyphs = []; G.nums = [];
    pos.forEach(function (p, i3) {
      var dot = mk("circle", { class: "sdot", cx: p.x.toFixed(1), cy: p.y.toFixed(1),
                               r: (1.35 * SC).toFixed(2) });
      var gl = mk("path", { class: "sglyph", d: starD(6.4 * SC * p.size),
                            transform: "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")" });
      gStars.appendChild(gl); gStars.appendChild(dot);

      /* the number, set along its ring — upside down at the bottom, as a chart is */
      var out = (SKY[i3].year === 0 ? -1 : 1);
      var nr  = (R * SKY[i3].rf) + out * 15 * SC;
      var nx  = CX + Math.cos(p.ang) * nr, ny = CY + Math.sin(p.ang) * nr * 0.955;
      var num = mk("text", { class: "num", "text-anchor": "middle",
        transform: "translate(" + nx.toFixed(1) + "," + ny.toFixed(1) + ") rotate(" + (deg(p.ang) + 90).toFixed(1) + ")" });
      num.setAttribute("dy", "0.34em");
      num.setAttribute("font-size", (10 * SC).toFixed(1));
      num.textContent = pad(i3 + 1);
      gStars.appendChild(num);

      var hit = mk("circle", { class: "shit", cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 19 });
      hit.addEventListener("click", function (ev) { ev.stopPropagation(); go(i3, 0); });
      gStars.appendChild(hit);

      G.dots.push(dot); G.glyphs.push(gl); G.nums.push(num);
    });

    /* ---- the ground, and the two of them on it ---- */
    var base = H - (narrow ? 34 : 44);
    var grnd = seeded(5150);
    gLow.appendChild(mk("path", { id: "ground",
      d: poly(hand({ x: -10, y: base }, { x: W + 10, y: base - 3 }, 4, grnd, 40), false) }));

    var pairW = clamp(W * 0.165, 156, 262);
    var u = pairW / 215;
    var ox = (narrow ? W * 0.50 : W * 0.40) - pairW * 0.46;

    function drawFigure(f, dx) {
      var g = mk("g", { transform: "translate(" + (ox + dx * u).toFixed(1) + "," + base.toFixed(1) +
                                   ") scale(" + u.toFixed(3) + ")" });
      var r = seeded(7717 + dx);
      var h = f.head;
      /* the head, drawn round-ish rather than round */
      var hp = [], t, hx, hy;
      for (t = 0; t <= 22; t++) {
        var aa = t / 22 * Math.PI * 2;
        var wob = 1 + (r() - 0.5) * 0.11;
        hp.push({ x: h.x + Math.cos(aa) * h.r * wob, y: h.y + Math.sin(aa) * h.r * wob });
      }
      g.appendChild(mk("path", { class: "figure", d: poly(hp, true) }));
      f.hair.forEach(function (s) {
        g.appendChild(mk("path", { class: "figure hair", d: handPoly(s, 2.4, r) }));
      });
      f.lines.forEach(function (s) {
        g.appendChild(mk("path", { class: "figure", d: handPoly(s, 2.2, r) }));
      });
      return g;
    }
    gLow.appendChild(drawFigure(figureA(), 0));
    gLow.appendChild(drawFigure(figureB(), 124));

    svg.appendChild(gDust);
    svg.appendChild(gChart);
    svg.appendChild(gBody);
    svg.appendChild(gChain);
    svg.appendChild(gStars);
    svg.appendChild(gLow);
  }

  /* ================= paint ================= */

  function setLine(el, text) {
    if (text && text.trim()) { el.textContent = text; el.className = "vline"; }
    else { el.textContent = "not said yet"; el.className = "vline is-empty"; }
  }

  function drawLeader(p) {
    if (G.narrow || !p) { G.leader.setAttribute("class", ""); return; }
    var rect = elCap.getBoundingClientRect();
    var ax = rect.left - 16, ay = rect.top + 12;
    if (ax < p.x + 30) { G.leader.setAttribute("class", ""); return; }
    var rnd = seeded(4242);
    var mid = { x: p.x + (ax - p.x) * 0.42, y: p.y + (ay - p.y) * 0.78 };
    var pts = [p].concat(hand(p, mid, 9, rnd, 12)).concat(hand(mid, { x: ax, y: ay }, 7, rnd, 12));
    pts.push({ x: ax + 14, y: ay });
    var d = poly(pts, false);
    G.leader.setAttribute("d", d);
    var L = G.leader.getTotalLength ? G.leader.getTotalLength() : 900;
    G.leader.setAttribute("stroke-dasharray", L.toFixed(1));
    G.leader.setAttribute("stroke-dashoffset", L.toFixed(1));
    /* let the browser take the initial offset before animating it away */
    G.leader.getBoundingClientRect();
    G.leader.setAttribute("stroke-dashoffset", "0");
    G.leader.setAttribute("class", "is-on");
  }

  function paint(animateLeader) {
    var done = (current === N - 1 && beat === 1);
    document.body.className = done ? "is-done" : "";

    /* the chain reaches a star only once both of them have spoken about it */
    var reach = (beat === 1) ? current : current - 1;
    G.chain.setAttribute("stroke-dashoffset",
      (reach < 0 ? G.total : G.total - G.nodeLen[reach]).toFixed(1));
    G.chain.setAttribute("class", done ? "is-done" : "");

    G.dots.forEach(function (dot, i) {
      var lit  = i < current || (i === current);
      var here = (i === current);
      dot.setAttribute("class", "sdot" + (here ? " is-here" : (lit ? " is-lit" : "")));
      dot.setAttribute("r", (lit ? (here ? 2.6 : 2.1) : 1.35) * G.SC);
      var full = (i < current) || (here && beat === 1);
      G.glyphs[i].setAttribute("class", "sglyph" + (full ? (here ? " is-on is-here" : " is-on") : ""));
      G.nums[i].setAttribute("class", "num" + (here ? " is-here" : (i < current ? " is-lit" : "")));
    });

    if (current < 0) {
      G.cur.setAttribute("class", "");
      G.leader.setAttribute("class", "");
      elCap.className = "plate is-start";
      elPr.textContent = OPENING;
      elCN.innerHTML = "<em>—</em> / 24";
      elCY.innerHTML = "the sky, unlit";
      elHint.className = "plate";
      elFoot.className = "";
      return;
    }

    var p = G.pos[current];
    G.cur.setAttribute("cx", p.x.toFixed(1));
    G.cur.setAttribute("cy", p.y.toFixed(1));
    G.cur.setAttribute("class", "is-on");

    if (animateLeader !== false) drawLeader(p);

    var e = ENTRIES[current];
    elCap.className = "plate";
    elPr.textContent = e.prompt;
    setLine(elLA, e.a);
    setLine(elLB, e.b);
    elVA.className = "voice";
    elVB.className = beat === 1 ? "voice" : "voice is-waiting";
    elCN.innerHTML = pad(e.n) + " <em>/ 24</em>";
    elCY.innerHTML = "year <b>" + (current < 12 ? "one" : "two") + "</b> · " +
                     (beat === 1 ? "both spoken" : PEOPLE.a + " has spoken");
    elHint.className = "plate is-off";
    elFoot.className = done ? "is-on" : "";
  }

  /* ================= moving through it ================= */

  function next() {
    if (current < 0) { current = 0; beat = 0; }
    else if (beat === 0) { beat = 1; }
    else if (current < N - 1) { current++; beat = 0; }
    else return;
    paint();
  }
  function prev() {
    if (beat === 1) { beat = 0; }
    else if (current > 0) { current--; beat = 1; }
    else { current = -1; beat = 0; }
    paint();
  }
  function go(i, b) {
    current = clamp(i, -1, N - 1);
    beat = (b === undefined) ? 0 : b;
    paint();
  }

  document.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if (k === " " || k === "Spacebar" || k === "Enter" || k === "ArrowRight" || k === "ArrowDown") {
      ev.preventDefault(); next();
    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "Backspace") {
      ev.preventDefault(); prev();
    } else if (k === "Home") {
      ev.preventDefault(); go(-1, 0);
    } else if (k === "End") {
      ev.preventDefault(); go(N - 1, 1);
    }
  });

  /* click has to carry the whole thing on its own — an embedded frame
     may never get the keyboard */
  document.addEventListener("click", function (ev) {
    if (ev.target && ev.target.classList && ev.target.classList.contains("shit")) return;
    next();
  });

  var tY = null;
  window.addEventListener("touchstart", function (ev) { tY = ev.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", function (ev) {
    if (tY === null) return;
    var dy = tY - ev.changedTouches[0].clientY;
    if (Math.abs(dy) > 44) { if (dy > 0) next(); else prev(); }
    tY = null;
  }, { passive: true });

  var rz;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { build(); paint(false); if (current >= 0) drawLeader(G.pos[current]); }, 140);
  });

  build();
  paint();
  try { window.focus(); } catch (e) {}
})();
</script>
