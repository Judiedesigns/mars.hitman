<title>twenty-four</title>

<style>
/* twenty-four — paper, ink, one orange thread */

:root {
  --paper:  #f2f0ec;
  --paper-2:#e9e6e0;
  --ink:    #171614;
  --ink-40: rgba(23, 22, 20, 0.40);
  --ink-25: rgba(23, 22, 20, 0.25);
  --ink-12: rgba(23, 22, 20, 0.12);
  --thread: #e8420a;

  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino,
           "Times New Roman", Times, serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body { cursor: default; }

/* ---------- the field ---------- */

#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.node {
  fill: var(--ink);
  transition: r 420ms ease, fill 420ms ease, opacity 420ms ease;
  cursor: pointer;
}
.node.is-unlit  { opacity: 0.82; }
.node.is-past   { opacity: 1; }
.node.is-here   { fill: var(--thread); }

.node-hit { fill: transparent; cursor: pointer; }

.halo {
  fill: none;
  stroke: var(--thread);
  stroke-width: 1;
  opacity: 0;
  transition: opacity 500ms ease, r 500ms cubic-bezier(.2,.8,.2,1);
}
.halo.is-on { opacity: 0.55; }

#thread {
  fill: none;
  stroke: var(--thread);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke-dashoffset 900ms cubic-bezier(.35,.02,.2,1);
}

/* ---------- the counter ---------- */

#counter {
  position: fixed;
  top: 2.2rem;
  left: 2.6rem;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-40);
  user-select: none;
}
#counter b { color: var(--ink); font-weight: 500; }

/* ---------- the text, arriving at the bottom right ---------- */

#panel {
  position: fixed;
  right: 3.2rem;
  bottom: 3.0rem;
  width: min(42ch, calc(100vw - 6.4rem));
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 700ms ease, transform 700ms ease;
  pointer-events: none;
}
#panel.is-on { opacity: 1; transform: none; }

#prompt {
  font-family: var(--sans);
  font-size: 10.5px;
  line-height: 1.5;
  letter-spacing: 0.11em;
  text-transform: lowercase;
  color: var(--ink-40);
  margin: 0 0 1.5rem;
}

.voice { margin: 0 0 1.4rem; }
.voice:last-child { margin-bottom: 0; }

.voice-name {
  display: block;
  font-family: var(--sans);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-25);
  margin-bottom: 0.42rem;
}

.voice-line {
  margin: 0;
  font-size: 15px;
  line-height: 1.62;
  white-space: pre-wrap;
}
.voice-line.is-empty {
  color: var(--ink-25);
  font-style: italic;
}

#sig {
  margin-top: 2.2rem;
  font-family: var(--sans);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: var(--ink-25);
  line-height: 1.7;
}

/* ---------- the opening frame ---------- */

#hint {
  position: fixed;
  left: 50%;
  bottom: 2.4rem;
  transform: translateX(-50%);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-25);
  transition: opacity 600ms ease;
  user-select: none;
}
#hint.is-off { opacity: 0; }

@media (max-width: 720px) {
  #panel   { right: 1.4rem; left: 1.4rem; bottom: 1.8rem; width: auto; }
  #counter { top: 1.4rem; left: 1.4rem; }
  .voice-line { font-size: 14px; }
}

/* ---------- the walk ---------- */

#ghost {
  fill: none;
  stroke: var(--thread);
  stroke-width: 1.4;
  stroke-linecap: round;
  opacity: 0;
  transition: opacity 600ms ease;
}
#ghost.is-on { opacity: 0.22; }

.walker {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  letter-spacing: 0.09em;
  fill: var(--ink-40);
  pointer-events: none;
}

/* ---------- landmarks: waypoints at odd angles ---------- */

.landmark {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  letter-spacing: 0.07em;
  fill: var(--ink-40);
  pointer-events: none;
  user-select: none;
}
.landmark .lm-arrow { font-size: 13px; }
.landmark .lm-sub   { font-size: 9.5px; fill: var(--ink-25); }

/* the second voice waits until it is spoken */
.voice.is-waiting { opacity: 0.16; transition: opacity 500ms ease; }
.voice            { transition: opacity 500ms ease; }

/* ---------- footer ---------- */

#footer {
  position: fixed;
  left: 50%;
  bottom: 1.5rem;
  transform: translateX(-50%);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: var(--ink-12);
  white-space: nowrap;
  pointer-events: none;
}
@media (max-width: 720px) { #footer { display: none; } }

@media (prefers-reduced-motion: reduce) {
  #thread, #ghost, .node, .halo, #panel, #hint, .voice {
    transition-duration: 1ms !important;
  }
}
</style>

<svg id="field" aria-label="twenty-four points, joined in order"></svg>

<div id="counter">&mdash; / 24</div>

<div id="panel">
  <p id="prompt"></p>

  <div class="voice">
    <span class="voice-name" id="name-a">me</span>
    <p class="voice-line" id="voice-a"></p>
  </div>

  <div class="voice" id="block-b">
    <span class="voice-name" id="name-b">you</span>
    <p class="voice-line" id="voice-b"></p>
  </div>

  <div id="sig"></div>
</div>

<div id="hint">press space to go &mdash; or click</div>

<div id="footer"></div>

<script>
/* ------------------------------------------------------------------
   entries.js — the only file you need to edit.

   24 months. 24 things. Each one has two sides: what you say about
   them, and what they say about you. Nothing here is required to be
   filled in at once — an empty string just leaves that dot unlit.

   `prompt` is a scaffold, not a rule. Delete it, rewrite it, ignore it.
   It runs small-and-specific at 01 and whole-person by 24.
------------------------------------------------------------------ */

var PEOPLE = {
  a: "me",    // ← your name
  b: "you"    // ← their name
};

var TITLE = "twenty-four";
var SUBTITLE = "two years, said one at a time";

/* Landmarks — the things that aren't one of the 24, but that the two
   years happened around. They sit out in the empty space at odd angles,
   some upside down, the way waypoints do on a walking map. Move them,
   rewrite them, add or delete freely.

   x / y are positions in a 1000x1000 field. rot is degrees. */

var LANDMARKS = [
  { arrow: "up",    label: "where we met",     sub: "month 01", x: 706, y: 104, rot:  -7 },
  { arrow: "left",  label: "the long winter",  sub: "month 09", x: 146, y: 296, rot: -34 },
  { arrow: "right", label: "the trip",         sub: "month 15", x: 892, y: 432, rot: -78 },
  { arrow: "left",  label: "the bad week",     sub: "month 18", x: 118, y: 648, rot:  11 },
  { arrow: "down",  label: "your kitchen",     sub: "month 21", x: 208, y: 838, rot: 168 },
  { arrow: "down",  label: "here",             sub: "month 24", x: 566, y: 902, rot:   4 }
];

var ENTRIES = [
  { n:  1, prompt: "a small physical detail — something in how they move",        a: "", b: "" },
  { n:  2, prompt: "a sound they make",                                            a: "", b: "" },
  { n:  3, prompt: "something they say constantly and don't notice",               a: "", b: "" },
  { n:  4, prompt: "a thing they're good at that they'd never list",               a: "", b: "" },
  { n:  5, prompt: "how they enter a room",                                        a: "", b: "" },
  { n:  6, prompt: "something they taught you without meaning to",                 a: "", b: "" },
  { n:  7, prompt: "a thing they find funny that nobody else does",                a: "", b: "" },
  { n:  8, prompt: "how they are when they're tired",                              a: "", b: "" },
  { n:  9, prompt: "something they have never once given up on",                   a: "", b: "" },
  { n: 10, prompt: "a time they were right and you were wrong",                    a: "", b: "" },
  { n: 11, prompt: "what they do when someone else is sad",                        a: "", b: "" },
  { n: 12, prompt: "a thing that annoyed you at first and doesn't now",            a: "", b: "" },
  { n: 13, prompt: "something they made",                                          a: "", b: "" },
  { n: 14, prompt: "a place that belongs to them",                                 a: "", b: "" },
  { n: 15, prompt: "how they handle being wrong",                                  a: "", b: "" },
  { n: 16, prompt: "a thing they protect",                                         a: "", b: "" },
  { n: 17, prompt: "something they carry that they never asked for",               a: "", b: "" },
  { n: 18, prompt: "how they've changed in two years",                             a: "", b: "" },
  { n: 19, prompt: "what hasn't changed at all",                                    a: "", b: "" },
  { n: 20, prompt: "a thing you'd defend about them to a stranger",                a: "", b: "" },
  { n: 21, prompt: "something you'd only ever say to their face",                  a: "", b: "" },
  { n: 22, prompt: "what you would miss first",                                    a: "", b: "" },
  { n: 23, prompt: "what they are to you now that they weren't at month one",      a: "", b: "" },
  { n: 24, prompt: "the whole thing. why them.",                                   a: "", b: "" }
];
</script>

<script>
/* twenty-four
 *
 * 24 points on a two-turn spiral: one orbit per year, the second sitting
 * just outside the first, so you can see you've been here before and are
 * further along. A single hand-drawn thread joins them in order. The shape
 * only exists once the 24th thing has been said.
 */
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var W = 1000, H = 1000;
  var CX = 468, CY = 432;          // centre of the orbits
  var R0 = 88,  R1 = 352;          // month 01 innermost -> month 24 outermost
  var SQUASH = 0.855;              // seen at an angle, like a plotted chart
  var A0 = 0.92;                   // start bearing: 01 and 24 both fall lower-right,
                                   // so the thread ends pointing into the text
  var TURNS = 2;                   // two years
  var N = ENTRIES.length;

  /* deterministic noise, so the paper looks the same every time it opens */
  function seeded(seed) {
    return function () {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
  }
  var rand = seeded(240724);

  /* ---------- geometry ----------
     The order is a two-turn spiral, but nothing about it is regular: the
     angular step between months varies, and each point drifts in and out
     radially. At rest it should read as scattered marks on paper. The
     spiral only exists once the thread has been paid out. */

  var steps = [], sum = 0;
  for (var q = 0; q < N - 1; q++) {
    var st = 1 + (rand() - 0.5) * 0.9;
    steps.push(st); sum += st;
  }
  var SPAN = TURNS * 2 * Math.PI;

  var nodes = [];
  var ang = A0, walked = 0;
  for (var i = 0; i < N; i++) {
    var t = walked / sum;                       // 0 .. 1 along the two years
    var r = R0 + t * (R1 - R0) + (rand() - 0.5) * 46;
    nodes.push({
      i: i,
      x: CX + Math.cos(ang) * r,
      y: CY + Math.sin(ang) * r * SQUASH,
      r: 3.5 + rand() * 1.7                     // marks vary, as pen marks do
    });
    if (i < N - 1) { walked += steps[i]; ang = A0 + (walked / sum) * SPAN; }
  }

  /* a segment drawn by a hand rather than a plotter: it wanders off the
     straight line in the middle and lands exactly on both ends */
  function handSegment(p0, p1) {
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var a1 = (rand() - 0.5) * 2.2, a2 = (rand() - 0.5) * 1.1, ph = rand() * 6.283;
    var amp = Math.min(11, len * 0.045);
    var out = [], sub = 22;
    for (var s = 1; s <= sub; s++) {
      var u = s / sub;
      var env = Math.sin(Math.PI * u);
      var off = (a1 * Math.sin(u * 2.3 + ph) + a2 * Math.sin(u * 5.9 + ph * 2)) * env * amp;
      out.push({ x: p0.x + dx * u + nx * off, y: p0.y + dy * u + ny * off });
    }
    return out;
  }

  var pts = [nodes[0]];
  var nodeAt = [0];                       // index into pts for each node
  for (var k = 1; k < N; k++) {
    pts = pts.concat(handSegment(nodes[k - 1], nodes[k]));
    nodeAt.push(pts.length - 1);
  }

  /* cumulative arc length, so we can pay the thread out node by node */
  var cum = [0];
  for (var j = 1; j < pts.length; j++) {
    var ddx = pts[j].x - pts[j - 1].x, ddy = pts[j].y - pts[j - 1].y;
    cum.push(cum[j - 1] + Math.sqrt(ddx * ddx + ddy * ddy));
  }
  var TOTAL = cum[cum.length - 1];
  var nodeLen = nodeAt.map(function (idx) { return cum[idx]; });

  /* ---------- paint ---------- */

  var svg = document.getElementById("field");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  var d = "M " + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2);
  for (var p = 1; p < pts.length; p++) {
    d += " L " + pts[p].x.toFixed(2) + " " + pts[p].y.toFixed(2);
  }

  var thread = document.createElementNS(NS, "path");
  thread.setAttribute("id", "thread");
  thread.setAttribute("d", d);
  thread.setAttribute("stroke-dasharray", TOTAL);
  thread.setAttribute("stroke-dashoffset", TOTAL);
  svg.appendChild(thread);

  /* the step you are about to take, once you have both spoken */
  var ghost = document.createElementNS(NS, "path");
  ghost.setAttribute("id", "ghost");
  ghost.setAttribute("d", d);
  svg.appendChild(ghost);

  /* landmarks: the things the two years happened around, out in the
     empty space at odd angles, the way waypoints sit on a walking map */
  var ARROW = { up: "\u2191", down: "\u2193", left: "\u2190", right: "\u2192" };
  (typeof LANDMARKS === "undefined" ? [] : LANDMARKS).forEach(function (m) {
    var g = document.createElementNS(NS, "text");
    g.setAttribute("class", "landmark");
    g.setAttribute("text-anchor", "middle");
    g.setAttribute("transform", "translate(" + m.x + "," + m.y + ") rotate(" + (m.rot || 0) + ")");

    var t1 = document.createElementNS(NS, "tspan");
    t1.setAttribute("x", 0); t1.setAttribute("class", "lm-arrow");
    t1.textContent = ARROW[m.arrow] || ARROW.up;

    var t2 = document.createElementNS(NS, "tspan");
    t2.setAttribute("x", 0); t2.setAttribute("dy", "1.35em");
    t2.textContent = m.label;

    var t3 = document.createElementNS(NS, "tspan");
    t3.setAttribute("x", 0); t3.setAttribute("dy", "1.15em"); t3.setAttribute("class", "lm-sub");
    t3.textContent = m.sub;

    g.appendChild(t1); g.appendChild(t2); g.appendChild(t3);
    svg.appendChild(g);
  });

  var halo = document.createElementNS(NS, "circle");
  halo.setAttribute("class", "halo");
  halo.setAttribute("r", 16);
  svg.appendChild(halo);

  /* who is speaking, standing at the dot */
  var walker = document.createElementNS(NS, "text");
  walker.setAttribute("class", "walker");
  svg.appendChild(walker);

  var dots = nodes.map(function (nd) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "node is-unlit");
    c.setAttribute("cx", nd.x);
    c.setAttribute("cy", nd.y);
    c.setAttribute("r", nd.r);
    svg.appendChild(c);

    var hit = document.createElementNS(NS, "circle");   // generous tap target
    hit.setAttribute("class", "node-hit");
    hit.setAttribute("cx", nd.x);
    hit.setAttribute("cy", nd.y);
    hit.setAttribute("r", 20);
    hit.addEventListener("click", function () { go(nd.i); });
    svg.appendChild(hit);

    return c;
  });

  /* ---------- the text ---------- */

  var panel   = document.getElementById("panel");
  var counter = document.getElementById("counter");
  var hint    = document.getElementById("hint");
  var elPrompt = document.getElementById("prompt");
  var elA = document.getElementById("voice-a");
  var elB = document.getElementById("voice-b");
  var voiceB = document.getElementById("block-b");
  var elSig = document.getElementById("sig");

  document.getElementById("name-a").textContent = PEOPLE.a;
  document.getElementById("name-b").textContent = PEOPLE.b;
  elSig.textContent = TITLE + " — " + SUBTITLE;
  document.getElementById("footer").textContent =
    TITLE.toUpperCase() + ": 24 things, one for each month, between " +
    PEOPLE.a + " and " + PEOPLE.b;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function setVoice(el, text) {
    if (text && text.trim()) {
      el.textContent = text;
      el.className = "voice-line";
    } else {
      el.textContent = "not said yet";
      el.className = "voice-line is-empty";
    }
  }

  var current = -1;   // which of the 24 we are standing at
  var beat = 0;       // 0 = mine, 1 = yours. The thread steps only once both have spoken.

  function paint() {
    thread.setAttribute("stroke-dashoffset",
      current < 0 ? TOTAL : TOTAL - nodeLen[current]);

    /* show only the segment from here to the next stop, and only after
       both voices have landed */
    if (current >= 0 && current < N - 1 && beat === 1) {
      var from = nodeLen[current], seg = nodeLen[current + 1] - from;
      ghost.setAttribute("stroke-dasharray", "0 " + from + " " + seg + " " + (TOTAL + 10));
      ghost.setAttribute("class", "is-on");
    } else {
      ghost.setAttribute("class", "");
    }

    dots.forEach(function (c, i) {
      c.setAttribute("class",
        "node " + (i === current ? "is-here" : (i < current ? "is-past" : "is-unlit")));
      c.setAttribute("r", i === current ? nodes[i].r + 1.5 : nodes[i].r);
    });

    if (current < 0) {
      halo.setAttribute("class", "halo");
      walker.textContent = "";
      panel.className = "";
      counter.innerHTML = "<b>&mdash;</b> / " + N;
      hint.className = "";
      return;
    }

    var nd = nodes[current];
    halo.setAttribute("cx", nd.x);
    halo.setAttribute("cy", nd.y);
    halo.setAttribute("class", "halo is-on");

    walker.setAttribute("x", nd.x + 15);
    walker.setAttribute("y", nd.y + 4.5);
    walker.textContent = (beat === 0 ? PEOPLE.a : PEOPLE.b).toUpperCase() + "\u2009...";

    var e = ENTRIES[current];
    elPrompt.textContent = e.prompt || "";
    setVoice(elA, e.a);
    setVoice(elB, e.b);
    voiceB.className = beat === 1 ? "voice" : "voice is-waiting";

    counter.innerHTML = "<b>" + pad(e.n) + "</b> / " + N +
      "&nbsp;&nbsp;&nbsp;year " + (current < 12 ? "one" : "two");
    panel.className = "is-on";
    hint.className = "is-off";
  }

  function next() {
    if (current < 0) { current = 0; beat = 0; }
    else if (beat === 0) { beat = 1; }
    else if (current < N - 1) { current++; beat = 0; }
    else return;
    paint();
  }

  function prev() {
    if (beat === 1) { beat = 0; }
    else if (current > 0) { current--; beat = 1; }
    else { current = -1; beat = 0; }
    paint();
  }

  function go(i, b) {
    current = Math.max(-1, Math.min(N - 1, i));
    beat = b === undefined ? 0 : b;
    paint();
  }

  /* ---------- moving through it ---------- */

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown" || ev.key === " " || ev.key === "Enter") {
      ev.preventDefault(); next();
    } else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") {
      ev.preventDefault(); prev();
    } else if (ev.key === "Home") {
      ev.preventDefault(); go(-1, 0);
    } else if (ev.key === "End") {
      ev.preventDefault(); go(N - 1, 1);
    }
  });

  /* clicking a dot goes straight there; clicking anywhere else walks on.
     Click has to work on its own — an embedded frame doesn't always have
     the keyboard yet. */
  document.addEventListener("click", function (ev) {
    if (ev.target && ev.target.classList && ev.target.classList.contains("node-hit")) return;
    next();
  });
  window.focus();

  var wheelLock = 0;
  window.addEventListener("wheel", function (ev) {
    var now = Date.now();
    if (now - wheelLock < 620) return;
    if (Math.abs(ev.deltaY) < 6) return;
    wheelLock = now;
    if (ev.deltaY > 0) next(); else prev();
  }, { passive: true });

  var touchY = null;
  window.addEventListener("touchstart", function (ev) { touchY = ev.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", function (ev) {
    if (touchY === null) return;
    var dy = touchY - ev.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) { if (dy > 0) next(); else prev(); }
    touchY = null;
  }, { passive: true });

  go(-1, 0);
})();
</script>
